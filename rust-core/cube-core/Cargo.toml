[package]
name = "cube-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Cube state, coord encoding, pruning tables, search engine, and CubeQL parser."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native-only: rayon for root-level parallel IDA*. WASM has no thread
# support without bundler/COOP-COEP headers, so we omit it there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.rayon]
version = "1.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

# Native-only: cs0x7f's min2phase Rust port for scramble→solved fast path.
# Not built for wasm because the table init mutates globals that don't play
# nicely with web workers without extra threading flags.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
min2phase = "0.2"

[dev-dependencies]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

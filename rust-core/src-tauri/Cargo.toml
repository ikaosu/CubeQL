[package]
name = "cubeql-tauri"
version = "0.1.0"
description = "CubeQL desktop app (Tauri 2.x). Rubik's cube state-search engine with sticker masks and the CubeQL DSL."
edition = "2021"
license = "Proprietary"

[lib]
name = "cubeql_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cube-core = { path = "../cube-core" }
